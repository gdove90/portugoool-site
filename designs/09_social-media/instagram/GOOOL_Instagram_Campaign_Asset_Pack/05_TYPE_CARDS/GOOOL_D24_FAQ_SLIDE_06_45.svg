  <text x="97.2" y="586" fill="#FCFBF8" font-family="Nimbus Sans Narrow, Arial Narrow, Arial, sans-serif" font-size="113" font-weight="700" letter-spacing="1">ARE YOU</text>
<text x="97.2" y="690" fill="#FCFBF8" font-family="Nimbus Sans Narrow, Arial Narrow, Arial, sans-serif" font-size="113" font-weight="700" letter-spacing="1">A CLUB?</text>
  <rect x="97.2" y="740" width="194" height="13" fill="#C61322"/>
  <text x="97.2" y="891" fill="#A7A7AA" font-family="Nimbus Sans Narrow, Arial Narrow, Arial, sans-serif" font-size="37" font-weight="400" letter-spacing="0.5">No. One mark, every fan.</text>
<text x="97.2" y="939" fill="#A7A7AA" font-family="Nimbus Sans Narrow, Arial Narrow, Arial, sans-serif" font-size="37" font-weight="400" letter-spacing="0.5">That is the point.</text>
  <text x="97.2" y="1242" fill="#FCFBF8" font-family="Nimbus Sans Narrow, Arial Narrow, Arial, sans-serif" font-size="37" font-weight="700" letter-spacing="3">SWIPE</text>
