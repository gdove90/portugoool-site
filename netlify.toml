[build]
  command = "npm run build"
  publish = ".next"

# Official Netlify adapter for Next.js (App Router, API routes, SSR).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# GOAL Athletics domain cutover: goalathletics.shop is the intended primary domain.
# Activate only after Netlify custom-domain verification, HTTPS, and DNS checks.
# Existing supplier /print/ and API callbacks must remain reachable on goool.shop.
# Old and historic public links redirect permanently after activation.
[[redirects]]
  from = "https://portugoool.com/*"
  to = "https://goalathletics.shop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.portugoool.com/*"
  to = "https://goalathletics.shop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.goool.shop/*"
  to = "https://goalathletics.shop/:splat"
  status = 301
  force = true

# /world-cup was a seasonal campaign page, retired 2026-09-22: the
# tournament is over and GOOOL is an everyday brand.
#
# The actual redirect lives in src/middleware.ts, NOT here. Middleware
# runs before Netlify redirect rules, and its catch-all bounces unknown
# paths to the splash, so a rule at this layer never ran. Kept only as
# the fallback for when middleware is eventually deleted.
[[redirects]]
  from = "/world-cup"
  to = "/shop"
  status = 301
  force = true

# /customize advertised jersey name/number printing that was never
# offered on any sellable product. Retired 2026-09-22. As with
# /world-cup the live redirect is in src/middleware.ts, which runs
# first; this is the fallback for when middleware is deleted.
[[redirects]]
  from = "/customize"
  to = "/shop"
  status = 301
  force = true
