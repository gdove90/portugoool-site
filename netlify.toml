[build]
  command = "npm run build"
  publish = ".next"

# Official Netlify adapter for Next.js (App Router, API routes, SSR).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# goool.shop is the primary domain (phase-2 flip, 2026-07-09).
# portugoool.com stays owned forever and 301s here.
[[redirects]]
  from = "https://portugoool.com/*"
  to = "https://goool.shop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.portugoool.com/*"
  to = "https://goool.shop/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.goool.shop/*"
  to = "https://goool.shop/:splat"
  status = 301
  force = true

# /world-cup was a seasonal campaign page, retired 2026-09-22: the
# tournament is over and GOOOL is an everyday brand. Nothing on the
# site linked to it, but any inbound link lands on the collection
# rather than a 404.
[[redirects]]
  from = "/world-cup"
  to = "/shop"
  status = 301
  force = true
